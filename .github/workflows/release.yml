name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate. The build fails if the APK is signed with anything else.
  EXPECTED_CERT_SHA256: 5538f87da6e4c31fb0c6a0524a26b6b21e80a7c59365b0896ce29304f4712ba1

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName "(.+)"/\1/p' app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CRISPSHOT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, unit tests and signed release build
        env:
          CRISPSHOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CRISPSHOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CRISPSHOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/verify.txt"
          # Every scheme's signer line must carry the pinned certificate, and there must be exactly one signer.
          grep -q '^Number of signers: 1$' "$RUNNER_TEMP/verify.txt" || { echo "::error::Expected exactly one signer"; exit 1; }
          digests=$(sed -nE 's/^.*[Ss]igner.* certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' "$RUNNER_TEMP/verify.txt" | sort -u)
          if [ "$digests" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with unexpected certificate(s): ${digests:-none found}"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Crispshot-$VERSION.apk"
          (cd dist && sha256sum "Crispshot-$VERSION.apk" > "Crispshot-$VERSION.apk.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag --list --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "SHA-256 of the signing certificate: \`$EXPECTED_CERT_SHA256\`"
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Crispshot $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
