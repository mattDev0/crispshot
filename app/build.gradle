plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'dev.mattdev0.crispshot'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "dev.mattdev0.crispshot"
        minSdk 30
        targetSdk 37
        versionCode 5
        versionName "1.1.0"

    }

    // Release signing comes from the environment (CI secrets). Without it, release builds are unsigned.
    def releaseKeystore = System.getenv("CRISPSHOT_KEYSTORE_FILE")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("CRISPSHOT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CRISPSHOT_KEY_ALIAS")
                keyPassword System.getenv("CRISPSHOT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            optimization {
                enable true
            }
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.work.runtime.ktx

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended

    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    constraints {
        implementation(libs.androidx.savedstate)
        implementation(libs.androidx.savedstate.ktx)
        implementation(libs.androidx.savedstate.compose)
    }

    debugImplementation libs.compose.ui.tooling

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.org.json
}
